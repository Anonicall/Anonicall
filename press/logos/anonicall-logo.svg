<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07091A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1030;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E82E8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0196E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="160" rx="12" fill="url(#bgGrad)"/>

  <!-- A icon mark -->
  <polygon points="60,120 90,40 120,120" fill="none" stroke="url(#pinkGrad)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="72" y1="93" x2="108" y2="93" stroke="#E82E8A" stroke-width="4" filter="url(#glow)"/>

  <!-- Wordmark -->
  <text x="145" y="102" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="38" font-weight="700" letter-spacing="3" fill="#EDEEF2" filter="url(#glow)">ANONICALL</text>

  <!-- Tagline -->
  <text x="146" y="124" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#08E8EB" opacity="0.85">PRIVATE · ENCRYPTED · DECENTRALIZED</text>

  <!-- Pink accent line -->
  <line x1="145" y1="110" x2="385" y2="110" stroke="#E82E8A" stroke-width="1" opacity="0.4"/>
</svg>
